services:
  - type: web
    name: shiphub-api
    runtime: python
    plan: free
    rootDir: converter
    buildCommand: pip install -r requirements.txt
    startCommand: python converter.py
    envVars:
      - key: MARIADB_HOST
        sync: false
      - key: MARIADB_PORT
        sync: false
      - key: MARIADB_USER
        sync: false
      - key: MARIADB_PASSWORD
        sync: false

  - type: web
    name: shiphub-dashboard
    runtime: python
    plan: free
    rootDir: converter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: MARIADB_HOST
        sync: false
      - key: MARIADB_PORT
        sync: false
      - key: MARIADB_USER
        sync: false
      - key: MARIADB_PASSWORD
        sync: false
